<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>หลังร้าน · ข้าวแกง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f2f5f3; --surface:#fff; --fg:#17231d; --muted:#65756c; --line:#dde5df;
    --accent:#138a55; --accent-ink:#fff; --accent-soft:#e2f3ea;
    --alert:#b23a48; --alert-soft:#f8e5e7; --warn:#9a6a00; --warn-soft:#fdf3d7;
    --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3}
  h1{font-size:20px} h2{font-size:16px}
  .wrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
  header.top .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  header.top .grow{flex:1}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .btn.small{padding:4px 10px;font-size:13px}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert-soft)}
  .btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=text],input[type=password],input[type=time]{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--fg);min-width:0}
  .pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
  .pill.open{background:var(--accent-soft);color:var(--accent)}
  .pill.closed{background:var(--alert-soft);color:var(--alert)}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted)}
  .banner{display:flex;align-items:center;gap:12px;background:var(--alert);color:#fff;border-radius:14px;padding:14px 16px;font-family:var(--display);font-size:20px;font-weight:600}
  .banner .q{font-size:40px;font-weight:700;line-height:1}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  .banner{animation:pulse 1s ease-in-out 3}
  @media (prefers-reduced-motion:reduce){.banner{animation:none}}
  .order{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
  .order:last-child{border-bottom:0}
  .order .q{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .order.new .q{color:var(--alert)}
  .order.done{opacity:.55}
  .order.cancelled .q,.order.cancelled .sum{text-decoration:line-through}
  .order .sum{white-space:pre-line}
  .order .note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:13px;width:fit-content}
  .order .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .order .total{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .cook .ln,.menu .ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .cook .ln:last-child,.menu .ln:last-child{border-bottom:0}
  .cook .n{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .menu .ln.out .name{color:var(--muted);text-decoration:line-through}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .tabs{display:flex;gap:6px}
  .login{max-width:360px;margin:15vh auto;padding:16px}
  .err{color:var(--alert);font-size:13px}
  [hidden]{display:none!important}
  @media (max-width:860px){ .wrap{grid-template-columns:minmax(0,1fr)} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>

<!-- Login -->
<div class="login card" id="loginBox" hidden>
  <h1>หลังร้าน</h1>
  <label for="keyInput" class="muted">รหัสแอดมิน (ADMIN_KEY)</label>
  <input type="password" id="keyInput" autocomplete="current-password">
  <button class="btn" id="loginBtn">เข้าสู่หลังร้าน</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- App -->
<div id="appBox" hidden>
  <header class="top"><div class="in">
    <h1 id="shopName">หลังร้าน</h1>
    <span class="pill" id="openPill">—</span>
    <span class="muted grow" id="syncInfo">กำลังโหลด…</span>
    <button class="btn" id="startBtn">🔔 เริ่มรับออเดอร์ (เปิดเสียง)</button>
  </div></header>

  <div class="wrap">
    <div class="col">
      <div class="banner" id="banner" hidden><span>ออเดอร์ใหม่</span><span class="q" id="bannerQ"></span><span id="bannerInfo" style="font-size:15px;font-weight:500"></span></div>

      <div class="stats">
        <div class="stat"><b id="sOrders">0</b><span>ออเดอร์</span></div>
        <div class="stat"><b id="sPlates">0</b><span>จาน</span></div>
        <div class="stat"><b id="sEggs">0</b><span>ไข่ดาว (ฟอง)</span></div>
        <div class="stat"><b id="sRevenue">0</b><span>ยอดขาย (บาท)</span></div>
      </div>

      <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <h2>คิววันนี้</h2>
          <div class="tabs">
            <button class="btn small on" data-filter="waiting">รอรับ</button>
            <button class="btn small ghost" data-filter="all">ทั้งหมด</button>
          </div>
        </div>
        <div id="orders"><div class="muted">ยังไม่มีออเดอร์</div></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2>เปิด / ปิดรับออเดอร์</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn" id="toggleOpen">—</button>
          <label class="muted" for="closeTime">ปิดรับเวลา</label>
          <input type="time" id="closeTime">
          <button class="btn small ghost" id="saveClose">บันทึก</button>
        </div>
        <div class="muted" id="closedReason"></div>
      </section>

      <section class="card cook">
        <h2>ต้องตักกับข้าว (ที่)</h2>
        <div id="cook"><div class="muted">—</div></div>
      </section>

      <section class="card menu">
        <h2>กับข้าววันนี้</h2>
        <div class="addrow">
          <input type="text" id="newItem" placeholder="เช่น แกงเขียวหวานไก่" maxlength="40">
          <button class="btn" id="addItem">เพิ่ม</button>
        </div>
        <div id="menu"></div>
        <button class="btn small ghost" id="copyLast">ใช้เมนูของวันก่อนหน้า</button>
      </section>

      <button class="btn small ghost" id="logout" style="align-self:flex-start">ออกจากระบบ</button>
    </div>
  </div>
</div>

<script>
/* ========= ตั้งค่า (แก้บรรทัดนี้) ========= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzeV2BKTBtf2oo3-ehgaQZREoKTUtzRsEWGoQs6w_TgbENirfjxNXXKWnaZmt65moAB/exec';
const POLL_MS = 7000;
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = '';
try { KEY = localStorage.getItem('adminKey') || ''; } catch (_) {}
let data = null, seenQueue = null, filter = 'waiting', audioCtx = null, wakeLock = null, timer = null, newSet = new Set();

async function getData() {
  const r = await fetch(`${API_URL}?action=admin&key=${encodeURIComponent(KEY)}`);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error);
  return d;
}
async function post(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key: KEY }) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error);
  return d;
}

/* ---------- login ---------- */
async function tryLogin() {
  try {
    data = await getData();
    try { localStorage.setItem('adminKey', KEY); } catch (_) {}
    $('#loginBox').hidden = true; $('#appBox').hidden = false;
    seenQueue = data.lastQueue;
    render();
    timer = setInterval(poll, POLL_MS);
  } catch (e) {
    $('#appBox').hidden = true; $('#loginBox').hidden = false;
    $('#loginErr').textContent = KEY ? e.message : '';
  }
}
$('#loginBtn').onclick = () => { KEY = $('#keyInput').value.trim(); tryLogin(); };
$('#keyInput').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };
$('#logout').onclick = () => { try { localStorage.removeItem('adminKey'); } catch (_) {} location.reload(); };

/* ---------- polling + sound ---------- */
async function poll() {
  try {
    const d = await getData();
    const fresh = d.orders.filter(o => o.queueNum > seenQueue && o.status === 'active');
    data = d;
    if (fresh.length) {
      fresh.forEach(o => newSet.add(o.orderId));
      seenQueue = d.lastQueue;
      const latest = fresh[0];
      $('#bannerQ').textContent = latest.queue;
      $('#bannerInfo').textContent = fresh.length > 1 ? `และอีก ${fresh.length - 1} ออเดอร์` : `${latest.plates.length} จาน · ${latest.total} ฿`;
      $('#banner').hidden = false;
      ding(fresh.length);
      setTimeout(() => { $('#banner').hidden = true; }, 15000);
      document.title = `(${latest.queue}) ออเดอร์ใหม่`;
      setTimeout(() => { document.title = 'หลังร้าน · ข้าวแกง'; }, 15000);
    }
    render();
  } catch (e) {
    $('#syncInfo').textContent = 'เชื่อมต่อไม่ได้ จะลองใหม่อัตโนมัติ · ' + e.message;
  }
}

function ding(times) {
  if (!audioCtx) return;
  const n = Math.min(times, 3);
  for (let k = 0; k < n; k++) {
    [880, 1175].forEach((f, i) => {
      const t = audioCtx.currentTime + k * 0.6 + i * 0.18;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  }
}

$('#startBtn').onclick = async () => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  ding(1);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  $('#startBtn').textContent = '🔔 เสียงเปิดอยู่';
  $('#startBtn').classList.add('ghost');
};
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock !== null) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  }
});

/* ---------- render ---------- */
function render() {
  const d = data, s = d.settings;
  $('#shopName').textContent = s.shop_name || 'หลังร้าน';
  const isOpen = !d.closedReason;
  $('#openPill').textContent = isOpen ? 'เปิดรับออเดอร์' : 'ปิดรับ';
  $('#openPill').className = 'pill ' + (isOpen ? 'open' : 'closed');
  $('#closedReason').textContent = d.closedReason || `ลูกค้าสั่งได้ถึง ${s.close_time} น.`;
  $('#toggleOpen').textContent = s.open ? 'ปิดรับชั่วคราว' : 'เปิดรับออเดอร์';
  $('#toggleOpen').className = 'btn ' + (s.open ? 'danger' : '');
  if (document.activeElement !== $('#closeTime')) $('#closeTime').value = s.close_time;
  $('#syncInfo').textContent = `${d.date} · อัปเดต ${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

  $('#sOrders').textContent = d.stats.orders;
  $('#sPlates').textContent = d.stats.plates;
  $('#sEggs').textContent = d.stats.eggs;
  $('#sRevenue').textContent = d.stats.revenue.toLocaleString('th-TH');

  // ต้องตัก
  const ic = d.stats.itemCount;
  const cookRows = d.menu.map(i => `<div class="ln"><span>${esc(i.name)}</span><span class="n">${ic[i.name] || 0}</span></div>`);
  cookRows.push(`<div class="ln"><span>ไข่ดาว (ฟอง)</span><span class="n">${d.stats.eggs}</span></div>`);
  $('#cook').innerHTML = cookRows.join('');

  // เมนู
  $('#menu').innerHTML = d.menu.length ? d.menu.map(i => `
    <div class="ln ${i.available ? '' : 'out'}">
      <span class="name">${esc(i.name)}</span>
      <span style="display:flex;gap:6px">
        <button class="btn small ${i.available ? 'ghost' : ''}" data-avail="${esc(i.name)}" data-to="${!i.available}">${i.available ? 'กดว่าหมด' : 'มีอีกครั้ง'}</button>
        <button class="btn small danger" data-del="${esc(i.name)}" aria-label="ลบ ${esc(i.name)}">ลบ</button>
      </span>
    </div>`).join('') : '<div class="muted">ยังไม่มีกับข้าววันนี้ เพิ่มด้านบน หรือกด "ใช้เมนูของวันก่อนหน้า"</div>';

  // คิว (รอรับ: เก่าไปใหม่ / ทั้งหมด: ใหม่ไปเก่า)
  let list = d.orders.slice();
  if (filter === 'waiting') list = list.filter(o => o.status === 'active' && !o.pickedUp).sort((a, b) => a.queueNum - b.queueNum);
  $('#orders').innerHTML = list.length ? list.map(o => {
    const cls = ['order', newSet.has(o.orderId) ? 'new' : '', o.pickedUp ? 'done' : '', o.status === 'cancelled' ? 'cancelled' : ''].join(' ');
    return `
    <div class="${cls}">
      <div><div class="q">${o.queue}</div><div class="muted">${esc(o.createdAt)}</div></div>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <div class="sum">${esc(o.summary)}</div>
        ${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
        <div class="muted">${esc(o.name)}${o.status === 'cancelled' ? ' · ยกเลิกแล้ว' : ''}</div>
      </div>
      <div class="acts">
        <div class="total">${o.total} ฿</div>
        ${o.status === 'cancelled' ? `<button class="btn small ghost" data-act="status" data-id="${o.orderId}" data-val="active">คืนคิว</button>` : `
        <button class="btn small ${o.paid ? 'on' : 'ghost'}" data-act="paid" data-id="${o.orderId}" data-val="${!o.paid}">${o.paid ? '✓ จ่ายแล้ว' : 'จ่ายแล้ว'}</button>
        <button class="btn small ${o.pickedUp ? 'on' : 'ghost'}" data-act="picked_up" data-id="${o.orderId}" data-val="${!o.pickedUp}">${o.pickedUp ? '✓ รับแล้ว' : 'รับแล้ว'}</button>
        <button class="btn small danger" data-act="status" data-id="${o.orderId}" data-val="cancelled">ยกเลิก</button>`}
      </div>
    </div>`;
  }).join('') : `<div class="muted">${filter === 'waiting' ? 'ไม่มีคิวที่รอรับ' : 'ยังไม่มีออเดอร์วันนี้'}</div>`;
}

/* ---------- actions ---------- */
async function act(fn) {
  try { await fn(); await poll(); } catch (e) { alert(e.message); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.filter) {
    filter = t.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.className = 'btn small ' + (b.dataset.filter === filter ? 'on' : 'ghost'));
    return render();
  }
  if (t.dataset.act) {
    const id = t.dataset.id, field = t.dataset.act;
    let value = t.dataset.val;
    if (field === 'status' && value === 'cancelled' && !confirm('ยกเลิกออเดอร์นี้?')) return;
    if (field !== 'status') value = value === 'true';
    newSet.delete(id);
    return act(() => post({ action: 'update_order', orderId: id, field, value }));
  }
  if (t.dataset.avail) return act(() => post({ action: 'set_available', name: t.dataset.avail, available: t.dataset.to === 'true' }));
  if (t.dataset.del) {
    if (!confirm(`ลบ "${t.dataset.del}" ออกจากเมนูวันนี้?`)) return;
    return act(() => post({ action: 'remove_item', name: t.dataset.del }));
  }
});
$('#addItem').onclick = () => {
  const name = $('#newItem').value.trim();
  if (!name) return;
  act(async () => { await post({ action: 'add_item', name }); $('#newItem').value = ''; $('#newItem').focus(); });
};
$('#newItem').onkeydown = e => { if (e.key === 'Enter') $('#addItem').click(); };
$('#copyLast').onclick = () => act(() => post({ action: 'copy_last_menu' }));
$('#toggleOpen').onclick = () => act(() => post({ action: 'set_settings', values: { open: !data.settings.open } }));
$('#saveClose').onclick = () => act(() => post({ action: 'set_settings', values: { close_time: $('#closeTime').value } }));

tryLogin();
</script>
</body>
</html>
