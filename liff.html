<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สั่งข้าวแกง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f4f7f5; --surface:#fff; --fg:#17231d; --muted:#65756c; --line:#dde5df;
    --accent:#138a55; --accent-ink:#fff; --accent-soft:#e2f3ea;
    --egg:#c98a00; --egg-soft:#fdf3d7; --danger:#b23a48; --danger-soft:#f8e5e7;
    --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
    --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
  h1,h2{font-family:var(--display);margin:0;line-height:1.3}
  h1{font-size:22px}
  h2{font-size:17px}
  .sub{color:var(--muted);font-size:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .prices{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
  .prices span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
  .prices span.egg{background:var(--egg-soft);border-color:transparent;color:var(--egg)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip:disabled{color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.7}
  .chip:not([aria-pressed="true"]):not(:disabled).full{opacity:.45}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .egg-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--egg-soft);cursor:pointer;user-select:none}
  .egg-toggle input{width:20px;height:20px;accent-color:var(--egg)}
  .btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .plate{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
  .plate:last-child{border-bottom:0}
  .plate .items{min-width:0}
  .plate .meta{color:var(--muted);font-size:13px}
  .plate .price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .x{background:none;border:0;color:var(--danger);font:inherit;font-size:13px;cursor:pointer;padding:0}
  textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;background:var(--surface);color:var(--fg)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .bar-in{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .bar .total{flex:1;font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar .total small{display:block;font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
  .notice{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px}
  .center{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .queue{font-family:var(--display);font-size:72px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="center" id="loading"><span class="sub">กำลังโหลดเมนู…</span></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="total"><small id="barInfo">ยังไม่มีจานในตะกร้า</small><span id="barTotal">0 ฿</span></div>
    <button class="btn btn-primary" id="submitBtn" disabled>ยืนยันสั่ง</button>
  </div>
</div>

<script>
/* ========= ตั้งค่า (แก้ 2 บรรทัดนี้) ========= */
const LIFF_ID = '2012577415-QqjJKuHE';                                   // จาก LINE Developers > LINE Login channel > LIFF
const API_URL = 'https://script.google.com/macros/s/AKfycbzeV2BKTBtf2oo3-ehgaQZREoKTUtzRsEWGoQs6w_TgbENirfjxNXXKWnaZmt65moAB/exec'; // Web app URL ของ Apps Script
/* ============================================ */

const state = { menu: null, current: { items: [], egg: false }, cart: [], note: '' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function platePrice(p) {
  const n = p.items.length;
  if (n < 1 || n > 3) return 0;
  return state.menu.prices[n] + (p.egg ? state.menu.prices.egg : 0);
}
const cartTotal = () => state.cart.reduce((s, p) => s + platePrice(p), 0);

async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}

async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const res = await fetch(API_URL + '?action=menu');
    state.menu = await res.json();
    if (!state.menu.ok) throw new Error(state.menu.error);
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="notice">โหลดไม่สำเร็จ: ${esc(e.message || e)}<br>ลองปิดแล้วเปิดใหม่อีกครั้ง</div>`;
  }
}

function render() {
  const m = state.menu;
  const bar = $('#bar');
  if (!m.open) {
    bar.hidden = true;
    $('#app').innerHTML = `
      <header><h1>${esc(m.shopName)}</h1></header>
      <div class="notice">${esc(m.closedReason || 'ตอนนี้ยังไม่เปิดรับออเดอร์')}</div>`;
    return;
  }
  const cur = state.current;
  const full = cur.items.length >= 3;
  const chips = m.items.map(i => {
    const on = cur.items.includes(i.name);
    return `<button class="chip ${full && !on ? 'full' : ''}" data-item="${esc(i.name)}" aria-pressed="${on}" ${i.available ? '' : 'disabled'}>${esc(i.name)}${i.available ? '' : ' (หมด)'}</button>`;
  }).join('');
  const curPrice = platePrice(cur);
  const cartHtml = state.cart.length ? state.cart.map((p, idx) => `
      <div class="plate">
        <div class="items">
          <div>จาน ${idx + 1}: ${esc(p.items.join(', '))}</div>
          <div class="meta">${p.items.length} อย่าง${p.egg ? ' · ไข่ดาว' : ''} · <button class="x" data-remove="${idx}">ลบ</button></div>
        </div>
        <div class="price">${platePrice(p)} ฿</div>
      </div>`).join('') : '<div class="empty">ยังไม่มีจาน เลือกกับข้าวด้านบนแล้วกด "ใส่ตะกร้า"</div>';

  $('#app').innerHTML = `
    <header>
      <h1>${esc(m.shopName)}</h1>
      <div class="sub">กับข้าววันนี้ · ปิดรับ ${esc(m.closeTime)} น.</div>
    </header>
    <div class="prices">
      <span>1 อย่าง ${m.prices[1]} ฿</span><span>2 อย่าง ${m.prices[2]} ฿</span><span>3 อย่าง ${m.prices[3]} ฿</span><span class="egg">ไข่ดาว +${m.prices.egg} ฿</span>
    </div>
    <section class="card">
      <div class="row"><h2>จานที่ ${state.cart.length + 1}</h2><span class="sub">เลือกแล้ว ${cur.items.length}/3</span></div>
      <div class="chips">${chips}</div>
      <label class="egg-toggle"><input type="checkbox" id="egg" ${cur.egg ? 'checked' : ''}> ใส่ไข่ดาว (+${m.prices.egg} ฿)</label>
      <button class="btn btn-ghost" id="addPlate" ${cur.items.length ? '' : 'disabled'}>
        ${cur.items.length ? `ใส่ตะกร้า · ${curPrice} ฿` : 'เลือกกับข้าวอย่างน้อย 1 อย่าง'}
      </button>
    </section>
    <section class="card">
      <h2>ตะกร้า</h2>
      <div>${cartHtml}</div>
      <textarea id="note" rows="2" maxlength="100" placeholder="หมายเหตุ เช่น ไม่เผ็ด แยกน้ำแกง">${esc(state.note)}</textarea>
    </section>`;

  bar.hidden = false;
  $('#barInfo').textContent = state.cart.length ? `${state.cart.length} จาน · จ่ายตอนรับข้าว` : 'ยังไม่มีจานในตะกร้า';
  $('#barTotal').textContent = cartTotal() + ' ฿';
  $('#submitBtn').disabled = !state.cart.length;
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-item]');
  if (chip && !chip.disabled) {
    const name = chip.dataset.item, items = state.current.items;
    if (items.includes(name)) items.splice(items.indexOf(name), 1);
    else if (items.length < 3) items.push(name);
    return render();
  }
  const rm = e.target.closest('[data-remove]');
  if (rm) { state.cart.splice(Number(rm.dataset.remove), 1); return render(); }
  if (e.target.closest('#addPlate')) {
    if (state.cart.length >= state.menu.maxPlates) return alertBox(`สั่งได้สูงสุด ${state.menu.maxPlates} จานต่อออเดอร์`);
    state.cart.push({ items: [...state.current.items], egg: state.current.egg });
    state.current = { items: [], egg: false };
    return render();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'egg') { state.current.egg = e.target.checked; render(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'note') state.note = e.target.value; });

function alertBox(msg) {
  const box = document.createElement('div');
  box.className = 'notice';
  box.textContent = msg;
  $('#app').prepend(box);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => box.remove(), 4000);
}

$('#submitBtn').addEventListener('click', async () => {
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  try {
    const res = await api({ action: 'order', idToken: liff.getIDToken(), plates: state.cart, note: state.note });
    if (!res.ok) throw new Error(res.error);
    // ส่งข้อความเข้าแชท → บอทตอบเลขคิวกลับ (reply ฟรี) และแอดมินเห็นในแชท
    if (liff.isInClient()) {
      try {
        await liff.sendMessages([{ type: 'text', text: `ยืนยันออเดอร์ #${res.code}\n${res.summary}\nรวม ${res.total} บาท` }]);
      } catch (_) { /* ส่งเข้าแชทไม่ได้ก็ไม่เป็นไร ออเดอร์บันทึกแล้ว */ }
    }
    showDone(res);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'ยืนยันสั่ง';
    alertBox(e.message || 'สั่งไม่สำเร็จ ลองใหม่อีกครั้ง');
    // เมนูอาจเปลี่ยน (ของหมด) โหลดใหม่
    try { state.menu = await (await fetch(API_URL + '?action=menu')).json(); render(); } catch (_) {}
  }
});

function showDone(res) {
  $('#bar').hidden = true;
  $('#app').innerHTML = `
    <div class="center">
      <span class="sub">รับออเดอร์แล้ว ✓</span>
      <span>เลขคิวของคุณ</span>
      <div class="queue">${esc(res.queue)}</div>
      <span class="sub">ยอดรวม ${res.total} บาท · จ่ายตอนรับข้าว</span>
      <span class="sub">แสดงเลขคิวนี้ตอนมารับ</span>
      <button class="btn btn-primary" id="closeBtn" style="margin-top:12px">กลับไปที่แชท</button>
    </div>`;
  $('#closeBtn').addEventListener('click', () => liff.isInClient() ? liff.closeWindow() : location.reload());
}

boot();
</script>
</body>
</html>
